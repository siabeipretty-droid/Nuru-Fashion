<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5eee5">
<title>NURU | Fashion Inspiration</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #faf7f2;
  color: #332b25;
}

header {
  padding: 22px 18px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-family: Georgia, serif;
  font-size: 30px;
  letter-spacing: 5px;
  color: #b18a52;
}

.tagline {
  font-size: 11px;
  letter-spacing: 2px;
  color: #827568;
}

.search {
  margin: 12px 18px;
  padding: 14px;
  width: calc(100% - 36px);
  border: 1px solid #e5d9ca;
  border-radius: 25px;
  background: white;
  font-size: 14px;
}

h2 {
  margin: 18px;
  font-family: Georgia, serif;
  font-weight: normal;
}

.categories {
  display: flex;
  gap: 10px;
  padding: 0 18px 18px;
  overflow-x: auto;
}

.categories button {
  border: 1px solid #d9c7af;
  background: transparent;
  color: #665442;
  padding: 10px 17px;
  border-radius: 25px;
  white-space: nowrap;
}

.categories button.active {
  background: #b18a52;
  color: white;
}

.grid {
  columns: 2;
  column-gap: 12px;
  padding: 0 12px 90px;
}

.item {
  break-inside: avoid;
  margin-bottom: 13px;
  background: white;
  border-radius: 13px;
  overflow: hidden;
}

.item img {
  width: 100%;
  display: block;
}

.item p {
  padding: 0 10px;
  font-size: 13px;
}

.bottom {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: white;
  display: flex;
  justify-content: space-around;
  padding: 15px 5px;
  border-top: 1px solid #eee2d5;
}

.bottom span {
  font-size: 13px;
  color: #806b52;
  cursor: pointer;
}

</style>
</head>

<body>

<header>
  <div>
    <div class="logo">NURU</div>
    <div class="tagline">DISCOVER YOUR STYLE</div>
  </div>
  <span>♡</span>
</header>

<input class="search" id="search"
placeholder="Search fashion inspiration...">

<h2>Discover fashion photos</h2>

<div class="categories">
  <button class="active" onclick="filter('All',this)">All</button>
  <button onclick="filter('Women',this)">Women</button>
  <button onclick="filter('Men',this)">Men</button>
  <button onclick="filter('Babies',this)">Babies</button>
  <button onclick="filter('Kids',this)">Kids</button>
  <button onclick="filter('Teens',this)">Teens</button>
</div>

<div class="grid" id="gallery">

<div class="item" data-category="Women">
<img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=600">
<p>Elegant Women's Fashion</p>
</div>

<div class="item" data-category="Men">
<img src="https://images.unsplash.com/photo-1516257984-b1b4d707412e?w=600">
<p>Modern Men's Style</p>
</div>

<div class="item" data-category="Women">
<img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=600">
<p>Luxury Street Style</p>
</div>

<div class="item" data-category="Kids">
<img src="https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?w=600">
<p>Little Fashion Stars</p>
</div>

<div class="item" data-category="Babies">
<img src="https://images.unsplash.com/photo-1519689680058-324335c77eba?w=600">
<p>Baby Inspiration</p>
</div>

<div class="item" data-category="Teens">
<img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=600">
<p>Teen Fashion Trends</p>
</div>

</div>

<nav class="bottom">
<span onclick="filter('All',document.querySelector('.categories button'))">⌂ Home</span>
<span onclick="document.getElementById('search').focus()">⌕ Search</span>
<span onclick="alert('Your saved fashion collection is coming soon!')">♡ Saved</span>
<span onclick="alert('Welcome to NURU!')">◎ Profile</span>
</nav>

<script>
function filter(category, button) {
  document.querySelectorAll('.categories button')
    .forEach(b => b.classList.remove('active'));

  button.classList.add('active');

  document.querySelectorAll('.item').forEach(item => {
    item.style.display =
      category === 'All' ||
      item.dataset.category === category ? '' : 'none';
  });
}

document.getElementById('search').addEventListener('input', function() {
  let value = this.value.toLowerCase();

  document.querySelectorAll('.item').forEach(item => {
    item.style.display =
      item.innerText.toLowerCase().includes(value) ? '' : 'none';
  });
});
</script>

</body>
</html>
