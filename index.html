
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURU - Fashion Inspiration</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf3;
            color: #333;
        }
        header {
            background: #d4af75;
            color: white;
            text-align: center;
            padding: 25px;
        }
        header h1 {
            font-size: 36px;
            margin: 0;
        }
        nav {
            text-align: center;
            padding: 15px;
            background: #f1e5d4;
        }
        nav a {
            color: #6b5138;
            text-decoration: none;
            margin: 8px;
            font-weight: bold;
        }
        .welcome {
            text-align: center;
            padding: 30px 15px;
        }
        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 15px;
        }
        .category {
            background: white;
            padding: 25px 10px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ddd;
            color: #9b784e;
            font-weight: bold;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #d4af75;
            color: white;
        }
    </style>
</head>
<body>

<header>
    <h1>NURU</h1>
    <p>Fashion Inspiration for Everyone</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#categories">Explore</a>
</nav>

<section class="welcome" id="home">
    <h2>Discover Your Style</h2>
    <p>Get inspired. Express yourself. Be uniquely you.</p>
</section>
section class="categories" id="categories">
    <div class="category">Women's Fashion</div>
    <div class="category">Men's Fashion</div>
    <div class="category">Baby Fashion</div>
    <div class="category">Kids Fashion</div>
    <div class="category">Teen Fashion</div>
    <div class="category">Beauty & Style</div>

<footer>
    <p>© 2026 NURU. Fashion Without Limits.</p>
</footer>

</body>
</html>
